<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Plan Test</title>
<style>
.card{padding:16px;background:#fff;border-radius:12px;max-width:400px;margin:20px auto}
h3{font-size:13px;color:#999}
textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:13px}
button{padding:8px 16px;border:none;border-radius:6px;background:#ff6b35;color:#fff;cursor:pointer;font-size:14px;margin-top:8px}
.plan-task{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #eee}
.plan-task.done .task-name{text-decoration:line-through;color:#999}
.task-name{flex:1}.task-time{color:#999;font-size:11px}
</style></head>
<body>
<div class="card">
  <h3>📋 今日计划</h3>
  <textarea id="planInput" rows="3" placeholder="写论文 2小时&#10;整理数据 30分钟&#10;做PPT"></textarea>
  <button id="planGenerateBtn">生成计划</button>
  <div id="planList"></div>
  <div id="planSummary" style="display:none"><span id="planDone">0</span>/<span id="planTotal">0</span></div>
</div>

<script>
(function() {
  var planInput = document.getElementById('planInput');
  var planBtn = document.getElementById('planGenerateBtn');
  var planList = document.getElementById('planList');
  var planSummary = document.getElementById('planSummary');
  var planDone = document.getElementById('planDone');
  var planTotal = document.getElementById('planTotal');

  if (!planInput || !planBtn || !planList) {
    alert('DOM 缺失! planInput:'+!!planInput+' planBtn:'+!!planBtn+' planList:'+!!planList);
    return;
  }

  function parseDuration(text) {
    var m = text.match(/(\d+)\s*(小时|h|hour|hrs?)/i);
    if (m) return parseInt(m[1]) * 60;
    m = text.match(/(\d+)\s*(分钟|min|mins?)/i);
    if (m) return parseInt(m[1]);
    return 25;
  }

  function cleanName(line) {
    return line
      .replace(/^\d+[\.\\)、，,\s]+/, '')
      .replace(/\d+\s*(?:小时|h|hour|hrs?|分钟|min|mins?)\s*/gi, '')
      .replace(/^[-\\)\.\s、，,，]+/, '')
      .replace(/[-\s、，,，]+$/, '')
      .trim();
  }

  function parsePlan(text) {
    return text.split(/\r?\n/)
      .map(function(l) { return l.trim(); })
      .filter(function(l) { return l; })
      .map(function(line) {
        return { name: cleanName(line) || '任务', minutes: parseDuration(line), done: false };
      });
  }

  function renderTasks(tasks) {
    planList.innerHTML = '';
    tasks.forEach(function(task) {
      var div = document.createElement('div');
      div.className = 'plan-task' + (task.done ? ' done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!task.done;
      cb.onchange = function() {
        task.done = cb.checked;
        div.classList.toggle('done', task.done);
        updateSummary(tasks);
      };
      var ns = document.createElement('span');
      ns.className = 'task-name';
      ns.textContent = task.name;
      var ts = document.createElement('span');
      ts.className = 'task-time';
      ts.textContent = task.minutes + 'min';
      div.appendChild(cb); div.appendChild(ns); div.appendChild(ts);
      planList.appendChild(div);
    });
    updateSummary(tasks);
  }

  function updateSummary(tasks) {
    var done = tasks.filter(function(t) { return t.done; }).length;
    planDone.textContent = done;
    planTotal.textContent = tasks.length;
    planSummary.style.display = tasks.length > 0 ? '' : 'none';
  }

  planBtn.onclick = function() {
    var text = planInput.value.trim();
    if (!text) return alert('输入为空！');
    var tasks = parsePlan(text);
    if (tasks.length === 0) return alert('没解析到任务！');
    renderTasks(tasks);
    alert('✅ 生成了 ' + tasks.length + ' 条任务！');
  };
})();
</script>
</body>
</html>
