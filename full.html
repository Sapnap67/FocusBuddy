<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusBuddy 🐱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf8f3;
    --card: #ffffff;
    --accent: #ff6b35;
    --accent2: #f0a500;
    --text: #2d2d2d;
    --muted: #999999;
    --good: #27ae60;
    --warn: #e67e22;
    --bad: #e74c3c;
    --pomodoro-bg: #fff5ee;
    --border: #eee;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #faf8f3 0%, #fff5ee 50%, #fdf2e9 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .subtitle { color: var(--muted); font-size: 14px; }

  .container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }

  .video-panel {
    position: relative;
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    flex: 1;
    min-width: 320px;
  }

  #video, #overlay {
    display: block;
    width: 100%;
    height: auto;
    transform: scaleX(-1);
  }
  #overlay { position: absolute; top: 0; left: 0; }

  .status-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 14px;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.9);
    z-index: 10;
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .status-badge.good { color: var(--good); }
  .status-badge.warn { color: var(--warn); }
  .status-badge.bad { color: var(--bad); }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 280px;
    flex: 0 0 280px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .card h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent); letter-spacing: 0.5px; }

  /* ====== Pomodoro Card ====== */
  .pomodoro-card {
    background: linear-gradient(135deg, var(--card), #fff8f0);
    border: 1px solid rgba(255,107,53,0.15);
  }
  .pomodoro-card h3 { color: var(--accent); }
  .pomodoro-timer {
    text-align: center;
    padding: 10px 0 6px;
  }
  .pomodoro-timer .time {
    font-size: 52px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(255,107,53,0.3);
    letter-spacing: 2px;
  }
  .pomodoro-timer .phase-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .pomodoro-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }
  .pomodoro-buttons button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-pomo-start {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    flex: 1;
  }
  .btn-pomo-start:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-pomo-start.active { background: linear-gradient(90deg, #e85d04, #d45500); }
  .btn-pomo-pause {
    background: #f5f5f5;
    color: var(--text);
    flex: 1;
  }
  .btn-pomo-pause:hover { background: #ebebeb; }
  .btn-pomo-reset {
    background: #fafafa;
    color: var(--muted);
    padding: 10px 14px !important;
  }
  .btn-pomo-reset:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  /* ====== Stats Card ====== */
  .stats-row {
    display: flex;
    gap: 12px;
    justify-content: space-between;
  }
  .stat-item {
    text-align: center;
    flex: 1;
    padding: 6px 0;
    background: rgba(0,0,0,0.03);
    border-radius: 10px;
  }
  .stat-item .num {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-item .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ====== Status Indicators ====== */
  .metric {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .metric:last-child { border-bottom: none; }
  .metric-label { font-size: 13px; color: var(--muted); }
  .metric-value { font-size: 13px; font-weight: 600; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--muted);
  }
  .dot.active-good { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.active-bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

  /* ====== Controls ====== */
  .controls { display: flex; flex-direction: column; gap: 10px; }
  button {
    padding: 11px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-stop { background: var(--bad); color: #fff; }
  .btn-stop:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-start:disabled, .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ====== Settings ====== */
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-row label { font-size: 13px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  .setting-val { font-size: 13px; color: var(--accent); min-width: 36px; text-align: right; }

  .loading { color: var(--warn); font-size: 13px; text-align: center; margin-top: 6px; }

  /* ====== Alert Banner ====== */
  .alert-banner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bad);
    color: #fff;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(231,76,60,0.3);
    z-index: 100;
    display: none;
    animation: pulse 0.6s infinite alternate;
  }
  @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }

  /* ====== Log ====== */
  .log-section {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    max-width: 1000px;
    width: 100%;
    margin-top: 16px;
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .log-header h3 { font-size: 14px; color: var(--accent); }
  .btn-log {
    padding: 5px 12px;
    font-size: 12px;
    background: #f5f5f5;
    color: var(--text);
    border-radius: 8px;
  }
  .btn-log:hover { background: #ebebeb; }
  .log-list {
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .log-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(231,76,60,0.1);
    border-left: 3px solid var(--bad);
    border-radius: 6px;
    font-size: 13px;
  }
  .log-item .log-reason { font-weight: 600; }
  .log-item .log-time { color: var(--muted); font-size: 12px; }
  .log-list::-webkit-scrollbar { width: 5px; }
  .log-list::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 3px; }

  footer { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>

<div class="alert-banner" id="alertBanner">⚠️ 分心了！请集中注意力</div>

<header>
  <h1>🐱 FocusBuddy</h1>
  <div class="subtitle">FaceMesh 专注力检测 + 番茄钟 · 用摄像头守护你的专注时刻</div>
</header>

<div class="container">
  <div class="video-panel">
    <div class="status-badge good" id="statusBadge">准备就绪</div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="side-panel">
    <!-- ====== Pomodoro Card ====== -->
    <div class="card pomodoro-card">
      <h3>🍅 番茄钟</h3>
      <div class="pomodoro-timer">
        <div class="time" id="pomodoroTime">25:00</div>
        <div class="phase-label" id="pomoPhase">准备开始</div>
      </div>
      <div class="pomodoro-buttons">
        <button class="btn-pomo-start" id="pomoStartBtn">▶ 开始专注</button>
        <button class="btn-pomo-pause" id="pomoPauseBtn" disabled>⏸ 暂停</button>
        <button class="btn-pomo-reset" id="pomoResetBtn">↻</button>
      </div>
    </div>

    <!-- ====== Stats Card ====== -->
    <div class="card">
      <h3>📊 专注统计</h3>
      <div class="stats-row">
        <div class="stat-item">
          <div class="num" id="focusScore">100</div>
          <div class="lbl">专注度</div>
        </div>
        <div class="stat-item">
          <div class="num" id="distractCount">0</div>
          <div class="lbl">分心</div>
        </div>
        <div class="stat-item">
          <div class="num" id="focusTime">0:00</div>
          <div class="lbl">专注时长</div>
        </div>
      </div>
    </div>

    <!-- ====== Detection Status ====== -->
    <div class="card">
      <h3>👁️ 实时状态</h3>
      <div class="metric">
        <span class="metric-label"><span class="dot" id="dotFace"></span>人脸检测</span>
        <span class="metric-value" id="valFace">—</span>
      </div>
      <div class="metric">
        <span class="metric-label"><span class="dot" id="dotEye"></span>眼睛状态</span>
        <span class="metric-value" id="valEye">—</span>
      </div>
      <div class="metric">
        <span class="metric-label"><span class="dot" id="dotHead"></span>头部姿态</span>
        <span class="metric-value" id="valHead">—</span>
      </div>
      <div class="metric">
        <span class="metric-label"><span class="dot" id="dotTurn"></span>东张西望</span>
        <span class="metric-value" id="valTurn">—</span>
      </div>
      <div class="metric">
        <span class="metric-label"><span class="dot" id="dotYawn"></span>打哈欠</span>
        <span class="metric-value" id="valYawn">—</span>
      </div>
    </div>

    <!-- ====== Settings ====== -->
    <div class="card">
      <h3>⚙️ 设置</h3>
      <div class="setting-row">
        <label>提醒延迟</label>
        <input type="range" id="thresholdSlider" min="1" max="10" value="3" step="1">
        <span class="setting-val" id="thresholdVal">3s</span>
      </div>
      <div class="setting-row">
        <label>声音提醒</label>
        <input type="checkbox" id="soundToggle" checked style="accent-color: var(--accent); width: 16px; height: 16px;">
      </div>
    </div>

    <!-- ====== Controls ====== -->
    <div class="card controls">
      <button class="btn-start" id="startBtn">▶ 开始检测</button>
      <button class="btn-stop" id="stopBtn" disabled>■ 停止</button>
      <div class="loading" id="loadingMsg"></div>
    </div>
  </div>
</div>

<!-- ====== Log Section ====== -->
<div class="log-section">
  <div class="log-header">
    <h3>📋 分心日志</h3>
    <button class="btn-log" id="clearLogBtn">清空</button>
  </div>
  <div class="log-list" id="logList">
    <div class="log-empty">暂无记录，开始检测后分心事件会显示在这里</div>
  </div>
</div>

<footer>
  Dream Team · HHCC 2026 · 课堂创意编程项目 🐱<br>
  基于 MediaPipe FaceMesh · 所有处理在本地完成，不上传任何数据
</footer>

<!-- MediaPipe FaceMesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
// ============================================================
// DOM References
// ============================================================
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusBadge = document.getElementById('statusBadge');
const alertBanner = document.getElementById('alertBanner');
const loadingMsg = document.getElementById('loadingMsg');

// 状态显示元素
const valFace = document.getElementById('valFace');
const valEye = document.getElementById('valEye');
const valHead = document.getElementById('valHead');
const valTurn = document.getElementById('valTurn');
const valYawn = document.getElementById('valYawn');
const dotFace = document.getElementById('dotFace');
const dotEye = document.getElementById('dotEye');
const dotHead = document.getElementById('dotHead');
const dotTurn = document.getElementById('dotTurn');
const dotYawn = document.getElementById('dotYawn');
const focusScoreEl = document.getElementById('focusScore');
const distractCountEl = document.getElementById('distractCount');
const focusTimeEl = document.getElementById('focusTime');

// 设置
const thresholdSlider = document.getElementById('thresholdSlider');
const thresholdVal = document.getElementById('thresholdVal');
const soundToggle = document.getElementById('soundToggle');

// 日志
const logList = document.getElementById('logList');
const clearLogBtn = document.getElementById('clearLogBtn');

// 番茄钟
const pomodoroTimeEl = document.getElementById('pomodoroTime');
const pomoPhaseEl = document.getElementById('pomoPhase');
const pomoStartBtn = document.getElementById('pomoStartBtn');
const pomoPauseBtn = document.getElementById('pomoPauseBtn');
const pomoResetBtn = document.getElementById('pomoResetBtn');

// ============================================================
// Detection State Variables
// ============================================================
let faceMesh = null;
let camera = null;
let running = false;

// 检测阈值
let EAR_THRESHOLD = 0.22;
let HEAD_THRESHOLD = 0.38;
const BLINK_IGNORE_MS = 800;
let eyeCloseStart = null;
let TURN_THRESHOLD = 0.62;
let MAR_THRESHOLD = 0.6;
const YAWN_MIN_MS = 1200;
let mouthOpenStart = null;
let yawnCooldown = 0;

// 分心状态跟踪
let distractStartTime = null;
let isDistracted = false;
let distractCount = 0;
let focusScore = 100;
let sessionStart = null;
let alerting = false;
let distractionLog = [];

// 画面尺寸
let frameW = 640, frameH = 480;

thresholdSlider.oninput = () => {
  thresholdVal.textContent = thresholdSlider.value + 's';
};

// ============================================================
// DETECTION ALGORITHMS (kept verbatim from working project)
// ============================================================

// 像素坐标距离（修正宽高比）
function dist(a, b) {
  const dx = (a.x - b.x) * frameW;
  const dy = (a.y - b.y) * frameH;
  return Math.hypot(dx, dy);
}

// 计算眼睛开合比例 (EAR - Eye Aspect Ratio)
function eyeAspectRatio(landmarks, indices) {
  const p = indices.map(i => landmarks[i]);
  // 垂直距离
  const v1 = dist(p[1], p[5]);
  const v2 = dist(p[2], p[4]);
  // 水平距离
  const h = dist(p[0], p[3]);
  return (v1 + v2) / (2 * h);
}

// FaceMesh 眼部关键点索引
const LEFT_EYE = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

function onResults(results) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const hasFace = results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0;

  let distracted = false;
  let reason = '';

  if (!hasFace) {
    // 离开摄像头
    valFace.textContent = '未检测到';
    dotFace.className = 'dot active-bad';
    valEye.textContent = '—';
    valHead.textContent = '—';
    valTurn.textContent = '—';
    valYawn.textContent = '—';
    dotEye.className = 'dot';
    dotHead.className = 'dot';
    dotTurn.className = 'dot';
    dotYawn.className = 'dot';
    distracted = true;
    reason = '离开画面';
  } else {
    const lm = results.multiFaceLandmarks[0];
    valFace.textContent = '正常';
    dotFace.className = 'dot active-good';

    // 1. 眼睛检测（区分眨眼和瞌睡：闭眼需持续超过 BLINK_IGNORE_MS 才算）
    const leftEAR = eyeAspectRatio(lm, LEFT_EYE);
    const rightEAR = eyeAspectRatio(lm, RIGHT_EYE);
    const ear = (leftEAR + rightEAR) / 2;
    const eyesClosedRaw = ear < EAR_THRESHOLD;

    if (eyesClosedRaw) {
      if (eyeCloseStart === null) eyeCloseStart = Date.now();
    } else {
      eyeCloseStart = null;
    }
    // 只有闭眼持续超过阈值才算瞌睡（过滤掉正常眨眼）
    const eyesClosed = eyeCloseStart !== null && (Date.now() - eyeCloseStart) >= BLINK_IGNORE_MS;

    if (eyesClosed) {
      valEye.textContent = `闭眼 😴 (${ear.toFixed(2)})`;
      dotEye.className = 'dot active-bad';
      distracted = true;
      reason = '闭眼/瞌睡';
    } else if (eyesClosedRaw) {
      valEye.textContent = `眨眼 😐 (${ear.toFixed(2)})`;
      dotEye.className = 'dot active-good';
    } else {
      valEye.textContent = `睁开 👁️ (${ear.toFixed(2)})`;
      dotEye.className = 'dot active-good';
    }

    // 2. 低头检测 (用鼻尖和眼睛的相对位置估算)
    const noseTip = lm[1];
    const foreHead = lm[10];
    const chin = lm[152];
    // 脸部垂直方向的比例，低头时鼻子会更靠近下巴上部
    const faceHeight = dist(foreHead, chin);
    const noseToChin = dist(noseTip, chin);
    const headRatio = noseToChin / faceHeight;
    // 低头时 headRatio 变小
    const headDown = headRatio < HEAD_THRESHOLD;

    if (headDown) {
      valHead.textContent = `低头 📉 (${headRatio.toFixed(2)})`;
      dotHead.className = 'dot active-bad';
      distracted = true;
      if (!reason) reason = '低头';
    } else {
      valHead.textContent = `正常 (${headRatio.toFixed(2)})`;
      dotHead.className = 'dot active-good';
    }

    // 3. 东张西望检测（头部左右转向）
    const leftCheek = lm[234];
    const rightCheek = lm[454];
    const noseToLeft = dist(noseTip, leftCheek);
    const noseToRight = dist(noseTip, rightCheek);
    // 正对摄像头时两边差不多，转头时一边明显变小
    const turnRatio = Math.min(noseToLeft, noseToRight) / Math.max(noseToLeft, noseToRight);
    const lookingAway = turnRatio < TURN_THRESHOLD;

    if (lookingAway) {
      valTurn.textContent = `转头 👀 (${turnRatio.toFixed(2)})`;
      dotTurn.className = 'dot active-bad';
      distracted = true;
      if (!reason) reason = '东张西望';
    } else {
      valTurn.textContent = `正常 (${turnRatio.toFixed(2)})`;
      dotTurn.className = 'dot active-good';
    }

    // 4. 打哈欠检测（嘴巴张开比例 MAR）
    const mouthTop = lm[13];
    const mouthBottom = lm[14];
    const mouthLeft = lm[61];
    const mouthRight = lm[291];
    const mar = dist(mouthTop, mouthBottom) / dist(mouthLeft, mouthRight);
    const mouthOpen = mar > MAR_THRESHOLD;

    if (mouthOpen) {
      if (mouthOpenStart === null) mouthOpenStart = Date.now();
    } else {
      mouthOpenStart = null;
    }
    const yawning = mouthOpenStart !== null && (Date.now() - mouthOpenStart) >= YAWN_MIN_MS;

    if (yawning) {
      valYawn.textContent = `打哈欠 😪 (${mar.toFixed(2)})`;
      dotYawn.className = 'dot active-bad';
      // 打哈欠不算分心，而是提示休息
      if (Date.now() > yawnCooldown) {
        showRest();
        addLogEntry('打哈欠（建议休息）');
        yawnCooldown = Date.now() + 15000; // 15秒内不重复提示
      }
    } else {
      valYawn.textContent = `正常 (${mar.toFixed(2)})`;
      dotYawn.className = 'dot active-good';
    }

  }

  handleDistraction(distracted, reason);
  updateStats();
}

const threshold = () => parseInt(thresholdSlider.value) * 1000;

function handleDistraction(distracted, reason) {
  const now = Date.now();

  if (distracted) {
    if (distractStartTime === null) {
      distractStartTime = now;
    }
    const elapsed = now - distractStartTime;

    if (elapsed >= threshold() && !isDistracted) {
      // 触发提醒
      isDistracted = true;
      distractCount++;
      triggerAlert(reason);
      addLogEntry(reason);
      // ESP32 integration
      esp32SendFocusData({ type: 'distraction', reason, count: distractCount, focusScore: Math.round(focusScore), timestamp: now });
    }

    if (isDistracted) {
      statusBadge.textContent = '⚠️ ' + reason;
      statusBadge.className = 'status-badge bad';
    } else {
      const remain = ((threshold() - elapsed) / 1000).toFixed(1);
      statusBadge.textContent = `检测中... (${reason})`;
      statusBadge.className = 'status-badge warn';
    }

    // 专注度下降
    focusScore = Math.max(0, focusScore - 0.15);
  } else {
    // 恢复专注
    distractStartTime = null;
    if (isDistracted) {
      isDistracted = false;
      hideAlert();
    }
    statusBadge.textContent = '✓ 专注中';
    statusBadge.className = 'status-badge good';
    // 专注度缓慢恢复
    focusScore = Math.min(100, focusScore + 0.05);
  }

  // ESP32 periodic data
  esp32SendFocusData({ type: 'heartbeat', focusScore: Math.round(focusScore), distractCount, running: true, timestamp: now });
}

// 打哈欠：显示温柔的休息提示（简化UI）
function showRest() {
  statusBadge.textContent = '😪 累了就休息一下~';
  statusBadge.className = 'status-badge warn';
  if (soundToggle.checked) playBeep();
  setTimeout(() => {
    // Only clear if still showing rest message
    if (statusBadge.textContent.includes('休息')) {
      statusBadge.textContent = '✓ 专注中';
      statusBadge.className = 'status-badge good';
    }
  }, 4000);
}

function triggerAlert(reason) {
  alertBanner.textContent = '⚠️ ' + reason + '！请集中注意力';
  alertBanner.style.display = 'block';
  alerting = true;
  if (soundToggle.checked) playBeep();
}

function hideAlert() {
  alertBanner.style.display = 'none';
  alerting = false;
}

// 用 Web Audio API 播放提示音
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}

// ============================================================
// Log Functions
// ============================================================

// 添加日志记录
function addLogEntry(reason) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-CN');
  distractionLog.push({ time: timeStr, reason: reason, timestamp: now.getTime() });

  // 移除空提示
  const emptyEl = logList.querySelector('.log-empty');
  if (emptyEl) emptyEl.remove();

  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerHTML = `<span class="log-reason">⚠️ ${reason}</span><span class="log-time">${timeStr}</span>`;
  logList.insertBefore(item, logList.firstChild);
}

// 清空日志
clearLogBtn.onclick = () => {
  distractionLog = [];
  logList.innerHTML = '<div class="log-empty">暂无记录，开始检测后分心事件会显示在这里</div>';
};

// ============================================================
// Stats Updates
// ============================================================

function updateStats() {
  focusScoreEl.textContent = Math.round(focusScore);
  distractCountEl.textContent = distractCount;
  if (sessionStart) {
    const secs = Math.floor((Date.now() - sessionStart) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    focusTimeEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }
}

// ============================================================
// ESP32 Integration Stub
// ============================================================

/**
 * ESP32 Integration Stub
 * Sends focus data to ESP32 hardware companion.
 * Uncomment the fetch() when your ESP32 server is running.
 */
let esp32LastHeartbeat = 0;
function esp32SendFocusData(data) {
  if (data.type === 'heartbeat' && Date.now() - esp32LastHeartbeat < 2000) return;
  if (data.type === 'heartbeat') esp32LastHeartbeat = Date.now();

  var statusMap = { focused:'happy', distracted:'worried', away:'sleep', eye_closed:'sleep' };
  var petState = statusMap[data.status] || 'happy';
  fetch('http://10.10.10.1/pet?state=' + petState, { mode:'no-cors' }).catch(function(){});
}

// ============================================================
// Pomodoro Timer
// ============================================================

const POMO_DURATION = 25 * 60; // 25 minutes in seconds
let pomodoroRemaining = POMO_DURATION;
let pomodoroRunning = false;
let pomodoroPaused = false;
let pomodoroInterval = null;
let pomoDetectionStarted = false;

function formatPomoTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updatePomodoroDisplay() {
  pomodoroTimeEl.textContent = formatPomoTime(pomodoroRemaining);
}

function pomodoroStop() {
  pomodoroRunning = false;
  pomodoroPaused = false;
  if (pomodoroInterval) { clearInterval(pomodoroInterval); pomodoroInterval = null; }
  pomodoroRemaining = POMO_DURATION;
  updatePomodoroDisplay();
  pomoStartBtn.textContent = '▶ 开始专注';
  pomoStartBtn.classList.remove('active');
  pomoPauseBtn.disabled = true;
  pomoPhaseEl.textContent = '准备开始';
  stop();
}

function pomodoroStart() {
  if (pomodoroRunning) { pomodoroStop(); return; }
  if (pomodoroPaused) { pomodoroResume(); return; }

  // 开始检测
  if (!running) {
    pomoDetectionStarted = true;
    start();
  }

  pomodoroRunning = true;
  pomodoroPaused = false;
  pomoStartBtn.textContent = '■ 停止';
  pomoStartBtn.classList.add('active');
  pomoPauseBtn.disabled = false;
  pomoPhaseEl.textContent = '🔥 专注中...';

  pomodoroInterval = setInterval(function() {
    pomodoroRemaining--;
    updatePomodoroDisplay();
    var m = Math.floor(pomodoroRemaining / 60), s = pomodoroRemaining % 60;
    fetch('http://10.10.10.1/timer?m=' + m + '&s=' + s, { mode:'no-cors' }).catch(function(){});
    if (pomodoroRemaining <= 0) pomodoroComplete();
  }, 1000);
}

function pomodoroPause() {
  if (!pomodoroRunning) return;
  pomodoroRunning = false;
  pomodoroPaused = true;
  clearInterval(pomodoroInterval);
  pomodoroInterval = null;
  pomoStartBtn.textContent = '▶ 继续';
  pomoStartBtn.classList.remove('active');
  pomoPauseBtn.disabled = true;
  pomoPhaseEl.textContent = '⏸ 已暂停';
}

function pomodoroResume() {
  pomodoroPaused = false;
  pomodoroRunning = true;
  pomoStartBtn.textContent = '■ 停止';
  pomoStartBtn.classList.add('active');
  pomoPauseBtn.disabled = false;
  pomoPhaseEl.textContent = '🔥 专注中...';
  pomodoroInterval = setInterval(function() {
    pomodoroRemaining--;
    updatePomodoroDisplay();
    var m = Math.floor(pomodoroRemaining / 60), s = pomodoroRemaining % 60;
    fetch('http://10.10.10.1/timer?m=' + m + '&s=' + s, { mode:'no-cors' }).catch(function(){});
    if (pomodoroRemaining <= 0) pomodoroComplete();
  }, 1000);
}

function pomodoroReset() {
  pomodoroRunning = false;
  pomodoroPaused = false;
  if (pomodoroInterval) { clearInterval(pomodoroInterval); pomodoroInterval = null; }
    clearInterval(pomodoroInterval);
    pomodoroInterval = null;
  }
  pomodoroRemaining = POMO_DURATION;
  updatePomodoroDisplay();
  pomoStartBtn.textContent = '▶ 开始专注';
  pomoStartBtn.classList.remove('active');
  pomoPauseBtn.disabled = true;
  pomoPhaseEl.textContent = '准备开始';
}

function pomodoroComplete() {
  pomodoroRunning = false;
  pomodoroPaused = false;
  clearInterval(pomodoroInterval);
  pomodoroInterval = null;
  pomodoroRemaining = POMO_DURATION;
  updatePomodoroDisplay();
  pomoStartBtn.textContent = '▶ 开始专注';
  pomoStartBtn.classList.remove('active');
  pomoPauseBtn.disabled = true;
  pomoPhaseEl.textContent = '✅ 专注完成！';
  // Beep to signal completion
  if (soundToggle.checked) {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => playBeep(), i * 400);
    }
  }
  // ESP32: session complete
  esp32SendFocusData({
    type: 'session_complete',
    duration: POMO_DURATION,
    focusScore: Math.round(focusScore),
    distractCount
  });
}

pomoStartBtn.onclick = pomodoroStart;
pomoPauseBtn.onclick = pomodoroPause;
pomoResetBtn.onclick = pomodoroReset;

// ============================================================
// Detection Start / Stop
// ============================================================

async function start() {
  loadingMsg.textContent = '正在加载模型...';
  pomoStartBtn.disabled = true;

  // 检查库是否加载成功
  if (typeof FaceMesh === 'undefined' || typeof Camera === 'undefined') {
    loadingMsg.textContent = '❌ 模型库加载失败，请检查网络连接后刷新';
    pomoStartBtn.disabled = false;
    return;
  }

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onResults);

  try {
    camera = new Camera(video, {
      onFrame: async () => { await faceMesh.send({ image: video }); },
      width: 640,
      height: 480
    });
    await camera.start();

    // 设置画布尺寸
    video.addEventListener('loadedmetadata', () => {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
    });
    setTimeout(() => {
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;
      frameW = overlay.width;
      frameH = overlay.height;
    }, 500);

    running = true;
    sessionStart = Date.now();
    focusScore = 100;
    distractCount = 0;
    stopBtn.disabled = false;
    loadingMsg.textContent = '';
    statusBadge.textContent = '✓ 专注中';
    pomoStartBtn.disabled = false;
    pomoPauseBtn.disabled = false;

    // ESP32: detection started
    esp32SendFocusData({ type: 'detection_started', timestamp: Date.now() });
  } catch (err) {
    loadingMsg.textContent = '❌ 无法访问摄像头：' + err.message;
    pomoStartBtn.disabled = false;
  }
}

function stop() {
  if (camera) camera.stop();
  running = false;
  hideAlert();
  statusBadge.textContent = '已停止';
  statusBadge.className = 'status-badge good';
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  // Stop pomodoro if running from detection stop
  if (pomodoroRunning) {
    pomodoroPause();
  }
  pomoDetectionStarted = false;

  // ESP32: detection stopped
  esp32SendFocusData({ type: 'detection_stopped', timestamp: Date.now() });
}

startBtn.onclick = start;
stopBtn.onclick = stop;
</script>
