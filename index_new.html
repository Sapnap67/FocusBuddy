<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusBuddy MVP</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f3;--card:#ffffff;--accent:#ff6b35;--accent2:#f0a500;--text:#2d2d2d;--muted:#999;--good:#27ae60;--warn:#e67e22;--bad:#e74c3c}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#faf8f3 0%,#fff5ee 50%,#fdf2e9 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:24px;color:var(--accent);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.main{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%}
.cam-box{position:relative;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);flex:1;min-width:320px}
.cam-box video,.cam-box canvas{display:block;width:100%;transform:scaleX(-1)}
.cam-box canvas{position:absolute;top:0;left:0}
#petCanvas{position:absolute;bottom:12px;right:12px;width:15rem;height:15rem;image-rendering:pixelated;image-rendering:crisp-edges;z-index:5;background:rgba(0,0,0,0.15);border-radius:8px}
.badge{position:absolute;top:12px;left:12px;padding:6px 14px;border-radius:20px;font-weight:600;font-size:13px;z-index:10;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px)}
.badge.good{color:var(--good)}
.badge.warn{color:var(--warn)}
.badge.bad{color:var(--bad)}
.panel{display:flex;flex-direction:column;gap:12px;min-width:240px;flex:0 0 240px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05)}
.card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px}
.stat-row .v{font-weight:600;color:var(--accent)}
.timer{font-size:48px;font-weight:700;text-align:center;color:var(--accent);font-family:'Courier New',monospace;margin-bottom:8px}
.timer-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px}
button{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;width:100%;transition:all .2s;color:#fff}
.btn-start{background:var(--accent)}
.btn-start:hover{opacity:.9}
.btn-stop{background:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.warn-banner{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;z-index:100;display:none;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.03)}}
.btn-sm{padding:8px 12px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;color:#fff;background:var(--accent);white-space:nowrap}
.btn-sm:hover{opacity:.9}
.plan-input-row{display:flex;gap:8px;align-items:flex-start}
.plan-input-row textarea{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:13px;resize:vertical;font-family:inherit;background:#faf8f3}
.plan-input-row textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.plan-list{margin-top:12px}
.plan-task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px}
.plan-task:last-child{border-bottom:none}
.plan-task input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.plan-task .task-name{flex:1}
.plan-task .task-time{color:var(--muted);font-size:11px;white-space:nowrap}
.plan-task.done .task-name{text-decoration:line-through;color:var(--muted)}
.plan-summary{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.04)}
.hidden{display:none}

/* ===== 猫猫养成卡片 ===== */
.pet-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05)}
.pet-card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.pet-level{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pet-level-num{font-size:28px;font-weight:700;color:var(--accent);min-width:40px}
.pet-level-label{font-size:12px;color:var(--muted)}
.pet-xp-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-bottom:4px}
.pet-xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s}
.pet-xp-text{font-size:11px;color:var(--muted);text-align:right}
.pet-skin{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pet-skin-item{width:32px;height:32px;border-radius:6px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.3;transition:all .2s}
.pet-skin-item.unlocked{border-color:var(--accent);opacity:1;background:rgba(255,107,53,0.08)}
.pet-achievement{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:12px}
.pet-achievement:last-child{border-bottom:none}
.pet-achievement .ach-icon{font-size:16px;width:24px;text-align:center}
.pet-achievement .ach-name{flex:1}
.pet-achievement .ach-name.locked{color:var(--muted)}
.pet-achievement .ach-name.unlocked{color:var(--text);font-weight:600}
.pet-achievement .ach-detail{font-size:10px;color:var(--muted)}
.ach-new-badge{background:var(--accent);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;animation:pulse .6s infinite alternate}
.pet-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border-radius:16px;padding:20px 32px;box-shadow:0 8px 32px rgba(0,0,0,0.2);z-index:200;text-align:center;display:none;animation:popIn .3s}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pet-toast .icon{font-size:40px;margin-bottom:8px}
.pet-toast .title{font-size:18px;font-weight:700;color:var(--accent)}
.pet-toast .desc{font-size:13px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<h1>🐱 FocusBuddy</h1>
<div class="sub">学习专注伴侣</div>

<div class="main">
  <div class="cam-box">
    <div class="badge good" id="badge">准备就绪</div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <canvas id="petCanvas" width="240" height="240"></canvas>
  </div>

  <div class="panel">
    <div class="card">
      <h3>👀 检测状态</h3>
      <div class="stat-row"><span>眼睛状态</span><span class="v" id="valEye">—</span></div>
      <div class="stat-row"><span>头部姿态</span><span class="v" id="valHead">—</span></div>
      <div class="stat-row"><span>东张西望</span><span class="v" id="valTurn">—</span></div>
    </div>

    <div class="card">
      <h3>🍅 番茄计时</h3>
      <div class="timer-label" id="pomodoroLabel">准备就绪</div>
      <div class="timer" id="pomodoroTimer">25:00</div>
      <button class="btn-start" id="mainBtn">▶ 开始专注</button>
    </div>

    <div class="pet-card">
      <h3>🐱 猫猫养成</h3>
      <div class="pet-level">
        <span class="pet-level-num" id="petLevel">Lv.1</span>
        <div style="flex:1">
          <div class="pet-level-label">努力值</div>
          <div class="pet-xp-bar"><div class="pet-xp-fill" id="petXpBar" style="width:0%"></div></div>
          <div class="pet-xp-text" id="petXpText">0 / 5 XP</div>
        </div>
      </div>
      <div class="pet-skin" id="petSkins">
        <div class="pet-skin-item unlocked" title="基础猫">🐱</div>
        <div class="pet-skin-item" title="礼帽猫">🎩</div>
        <div class="pet-skin-item" title="围巾猫">🧣</div>
        <div class="pet-skin-item" title="墨镜猫">🕶️</div>
        <div class="pet-skin-item" title="皇冠猫">👑</div>
      </div>
      <div id="petAchievements">
        <div class="pet-achievement"><span class="ach-icon">🏆</span><span class="ach-name locked">首个番茄钟</span></div>
      </div>
    </div>

    <div class="card">
      <h3>📋 今日计划</h3>
      <div class="plan-input-row">
        <textarea id="planInput" rows="3" placeholder="写今天要做的事，每行一条&#10;例如：&#10;写论文 2小时&#10;整理数据 30分钟&#10;做PPT"></textarea>
        <button id="planGenerateBtn" class="btn-sm">生成计划</button>
      </div>
      <div id="planList" class="plan-list"></div>
      <div id="planSummary" class="plan-summary hidden">
        <span id="planDone">0</span>/<span id="planTotal">0</span> 已完成
      </div>
    </div>
  </div>
</div>

<div class="warn-banner" id="warnBanner"></div>

<!-- Hidden elements for compatibility with original detection code -->
<div class="hidden">
  <span id="faceDot"></span>
  <span id="debugInfo"></span>
  <span id="focusScore">100</span>
  <span id="distCount">0</span>
  <span id="timer">00:00</span>
  <span id="timerLabel">—</span>
  <button id="startBtn"></button>
  <button id="stopBtn"></button>
</div>

<script>
// ==================== 检测代码（移植自旧项目 v1.7，已验证）====================

var video = document.getElementById('video');
var overlay = document.getElementById('overlay');
var ctx = overlay.getContext('2d');
var badge = document.getElementById('badge');
var warnBanner = document.getElementById('warnBanner');

// ===== 像素电子宠物 =====
var petCanvas = document.getElementById('petCanvas');
var petCtx = petCanvas.getContext('2d');
var currentPet = 'idle';

// ===== 24×24 像素猫 —— 三角耳+圆脸+收下巴 =====
// '0'=透明 '1'=主色 '2'=深色(瞳孔) '3'=白色(眼白)
// 共同骨架: 尖耳朵在上, 脸颊最宽, 下巴收窄
var PET = {
  happy: [
    '000000000000000000000000',  //  0
    '000000000000000000000000',  //  1
    '000000000110011000000000',  //  2  △  △ 耳朵尖
    '000000001111111000000000',  //  3  ^^^^^  耳朵展开
    '000000011111111100000000',  //  4  头顶
    '000000111111111110000000',  //  5  脸开始
    '000001111111111111000000',  //  6
    '000011111111111111100000',  //  7  脸颊最宽 ← 16px
    '000011133331113333111000',  //  8  眼白 3333  3333
    '000011132231113223111000',  //  9  瞳孔 3223  3223
    '000011133331113333111000',  // 10  眼白结束
    '000011111111111111100000',  // 11  脸
    '000001111111111111000000',  // 12  收窄
    '000000111111111110000000',  // 13
    '000000011100011100000000',  // 14  鼻子区域
    '000000001111111000000000',  // 15  ▼ 微笑
    '000000000111110000000000',  // 16  下巴
    '000000000011000000000000',  // 17  下巴尖
    '000000000000000000000000',  // 18
    '000000000000000000000000',  // 19
    '000000000000000000000000',  // 20
    '000000000000000000000000',  // 21
    '000000000000000000000000',  // 22
    '000000000000000000000000'   // 23
  ],
  worried: [
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000110011000000000',
    '000000001111111000000000',
    '000000011111111100000000',
    '000000111111111110000000',
    '000001111111111111000000',
    '000011111111111111100000',
    '000011133331113333111000',  // 眼白
    '000011132231113223111000',  // 瞳孔
    '000011133331113333111000',
    '000011111111111111100000',
    '000001111111111111000000',
    '000000111111111110000000',
    '000000011100011100000000',  // 愁眉嘴(小)
    '000000000011110000000000',  // 撇嘴
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000'
  ],
  angry: [
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000110011000000000',
    '000000001111111000000000',
    '000000011111111100000000',
    '000000111111111110000000',
    '000001111111111111000000',
    '000011112222222221110000',  // 倒八眉 \\////
    '000011133331113333111000',
    '000011132231113223111000',
    '000011133331113333111000',
    '000011111111111111100000',
    '000001111111111111000000',
    '000000111111111110000000',
    '000000011000001100000000',  // 咬牙嘴
    '000000000111110000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000'
  ],
  sleep: [
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000110011000000000',
    '000000001111111000000000',
    '000000011111111100000000',
    '000000111111111110000000',
    '000001111111111111000000',
    '000011111111111111100000',
    '000011122221112222111000',  // — — 闭眼横线
    '000011122221112222111000',  // — —
    '000011133331113333111000',
    '000011111111111111100000',
    '000001111111111111000000',
    '000000111111111110000000',
    '000000011111111000000000',  // 安详嘴
    '000000000111110000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000',
    '000000000000000000000000'
  ]
};

function drawPet(state) {
  if (state === currentPet) return;
  currentPet = state;
  var f = PET[state] || PET.sleep;
  var colorMap = {
    happy:  {'0':'transparent','1':'#ff6b35','2':'#333','3':'#fff'},
    worried:{'0':'transparent','1':'#e6b800','2':'#333','3':'#fff'},
    angry:  {'0':'transparent','1':'#e74c3c','2':'#333','3':'#fff'},
    sleep:  {'0':'transparent','1':'#5dade2','2':'#333','3':'#fff'}
  };
  var c = colorMap[state] || colorMap.happy;
  petCtx.clearRect(0, 0, 240, 240);
  for (var y = 0; y < 24; y++)
    for (var x = 0; x < 24; x++)
      if (f[y][x] !== '0') { petCtx.fillStyle = c[f[y][x]]; petCtx.fillRect(x * 10, y * 10, 10, 10); }
}

// 初始显示快乐猫
drawPet('happy');

// 然后 syncPet 在状态变化时调用

var startBtn = document.getElementById('startBtn');
var stopBtn = document.getElementById('stopBtn');
var loadingMsg = document.getElementById('timerLabel');

// 状态
var valEye = document.getElementById('valEye');
var valHead = document.getElementById('valHead');
var valTurn = document.getElementById('valTurn');
var faceDot = document.getElementById('faceDot');
var debugInfo = document.getElementById('debugInfo');
var focusScoreEl = document.getElementById('focusScore');
var distCountEl = document.getElementById('distCount');
var timerEl = document.getElementById('timer');
var timerLabel = document.getElementById('timerLabel');

var faceMesh = null;
var camera = null;
var running = false;

// 检测阈值（来自旧项目，已验证）
var EAR_THRESHOLD = 0.22;
var HEAD_THRESHOLD = 0.38;
var BLINK_IGNORE_MS = 800;
var eyeCloseStart = null;
var TURN_THRESHOLD = 0.62;
var MAR_THRESHOLD = 0.6;
var YAWN_MIN_MS = 1200;
var mouthOpenStart = null;
var yawnCooldown = 0;

// 分心状态
var distractStartTime = null;
var isDistracted = false;
var distractCount = 0;
var focusScore = 100;
var sessionStart = null;

// 画面尺寸（修正宽高比失真 — 旧项目坑2）
var frameW = 640, frameH = 480;

// 计时器
var timerInterval = null;
var focusSec = 0, distractSec = 0;

// ══════════ 以下全部来自旧项目，一字不改 ══════════

function dist(a, b) {
  var dx = (a.x - b.x) * frameW;
  var dy = (a.y - b.y) * frameH;
  return Math.hypot(dx, dy);
}

function eyeAspectRatio(landmarks, indices) {
  var p = indices.map(function(i) { return landmarks[i]; });
  var v1 = dist(p[1], p[5]);
  var v2 = dist(p[2], p[4]);
  var h = dist(p[0], p[3]);
  return (v1 + v2) / (2 * h);
}

var LEFT_EYE = [33, 160, 158, 133, 153, 144];
var RIGHT_EYE = [362, 385, 387, 263, 373, 380];

function onResults(results) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  var hasFace = results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0;
  var distracted = false;
  var reason = '';

  if (!hasFace) {
    valEye.textContent = '—';
    valHead.textContent = '—';
    valTurn.textContent = '—';
    faceDot.className = 'dot dot-red';
    debugInfo.textContent = '无人脸';
    distracted = true;
    reason = '离开画面';
  } else {
    var lm = results.multiFaceLandmarks[0];
    faceDot.className = 'dot dot-green';

    // 1. 眼睛检测
    var leftEAR = eyeAspectRatio(lm, LEFT_EYE);
    var rightEAR = eyeAspectRatio(lm, RIGHT_EYE);
    var ear = (leftEAR + rightEAR) / 2;
    var eyesClosedRaw = ear < EAR_THRESHOLD;

    if (eyesClosedRaw) {
      if (eyeCloseStart === null) eyeCloseStart = Date.now();
    } else {
      eyeCloseStart = null;
    }
    var eyesClosed = eyeCloseStart !== null && (Date.now() - eyeCloseStart) >= BLINK_IGNORE_MS;

    if (eyesClosed) {
      valEye.textContent = '闭眼 😴 (' + ear.toFixed(2) + ')';
      distracted = true;
      reason = '闭眼/瞌睡';
    } else if (eyesClosedRaw) {
      valEye.textContent = '眨眼 😐 (' + ear.toFixed(2) + ')';
    } else {
      valEye.textContent = '睁开 👀 (' + ear.toFixed(2) + ')';
    }

    // 2. 低头检测
    var noseTip = lm[1];
    var foreHead = lm[10];
    var chin = lm[152];
    var faceHeight = dist(foreHead, chin);
    var noseToChin = dist(noseTip, chin);
    var headRatio = noseToChin / faceHeight;
    var headDown = headRatio < HEAD_THRESHOLD;

    if (headDown) {
      valHead.textContent = '低头 📉 (' + headRatio.toFixed(2) + ')';
      distracted = true;
      if (!reason) reason = '低头';
    } else {
      valHead.textContent = '正常 (' + headRatio.toFixed(2) + ')';
    }

    // 3. 东张西望
    var leftCheek = lm[234];
    var rightCheek = lm[454];
    var noseToLeft = dist(noseTip, leftCheek);
    var noseToRight = dist(noseTip, rightCheek);
    var turnRatio = Math.min(noseToLeft, noseToRight) / Math.max(noseToLeft, noseToRight);
    var lookingAway = turnRatio < TURN_THRESHOLD;

    if (lookingAway) {
      valTurn.textContent = '转头 👀 (' + turnRatio.toFixed(2) + ')';
      distracted = true;
      if (!reason) reason = '东张西望';
    } else {
      valTurn.textContent = '正常 (' + turnRatio.toFixed(2) + ')';
    }

    // 4. 打哈欠
    var mouthTop = lm[13];
    var mouthBottom = lm[14];
    var mouthLeft = lm[61];
    var mouthRight = lm[291];
    var mar = dist(mouthTop, mouthBottom) / dist(mouthLeft, mouthRight);
    var mouthOpen = mar > MAR_THRESHOLD;

    if (mouthOpen) {
      if (mouthOpenStart === null) mouthOpenStart = Date.now();
    } else {
      mouthOpenStart = null;
    }
    var yawning = mouthOpenStart !== null && (Date.now() - mouthOpenStart) >= YAWN_MIN_MS;

    if (yawning && Date.now() > yawnCooldown) {
      yawnCooldown = Date.now() + 15000;
      showWarn('😪 你好像累了，休息一下吧~');
    }

    // 调试信息
    debugInfo.textContent = 'EAR:' + ear.toFixed(2) + ' Turn:' + turnRatio.toFixed(2) + ' Head:' + headRatio.toFixed(2) + ' MAR:' + mar.toFixed(2);
  }

  handleDistraction(distracted, reason);
  updateStats();
}

function handleDistraction(distracted, reason) {
  var now = Date.now();
  var threshold = 3000; // 3秒延迟

  if (distracted) {
    if (distractStartTime === null) distractStartTime = now;
    var elapsed = now - distractStartTime;

    if (elapsed >= threshold && !isDistracted) {
      isDistracted = true;
      distractCount++;
      showWarn('⚠ ' + reason + '！请集中注意力');
    }

    if (isDistracted) {
      badge.textContent = '⚠ ' + reason;
      badge.className = 'badge bad';
    } else {
      badge.textContent = '检测中...';
      badge.className = 'badge warn';
    }

    focusScore = Math.max(0, focusScore - 0.15);
  } else {
    distractStartTime = null;
    if (isDistracted) {
      isDistracted = false;
      warnBanner.style.display = 'none';
    }
    badge.textContent = '✓ 专注中';
    badge.className = 'badge good';
    focusScore = Math.min(100, focusScore + 0.05);
  }
}

function showWarn(msg) {
  warnBanner.textContent = msg;
  warnBanner.style.display = 'block';
  setTimeout(function() { warnBanner.style.display = 'none'; }, 4000);
}

function updateStats() {
  focusScoreEl.textContent = Math.round(focusScore);
  distCountEl.textContent = distractCount;
  if (sessionStart) {
    var secs = Math.floor((Date.now() - sessionStart) / 1000);
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    timerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
}

// ══════════ 启动/停止（使用旧项目的 Camera 工具类）══════════

async function start() {
  timerLabel.textContent = '正在加载模型...';
  startBtn.disabled = true;

  if (typeof FaceMesh === 'undefined' || typeof Camera === 'undefined') {
    alert('模型库加载失败，请检查网络后刷新');
    startBtn.disabled = false;
    return;
  }

  faceMesh = new FaceMesh({
    locateFile: function(file) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + file; }
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onResults);

  try {
    camera = new Camera(video, {
      onFrame: async function() { await faceMesh.send({ image: video }); },
      width: 640,
      height: 480
    });
    await camera.start();

    setTimeout(function() {
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;
      frameW = overlay.width;
      frameH = overlay.height;
    }, 500);

    running = true;
    sessionStart = Date.now();
    focusScore = 100;
    distractCount = 0;
    stopBtn.disabled = false;
    timerLabel.textContent = '专注计时中';
  } catch (err) {
    alert('摄像头无法访问：' + err.message);
    startBtn.disabled = false;
  }
}

function stop() {
  if (camera) camera.stop();
  running = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  badge.textContent = '已停止';
  badge.className = 'badge good';
  timerLabel.textContent = '未开始';
  valEye.textContent = '—';
  valHead.textContent = '—';
  valTurn.textContent = '—';
  faceDot.className = 'dot dot-gray';
  debugInfo.textContent = '';
  warnBanner.style.display = 'none';
  ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ══════════ 🍅 番茄计时 ══════════

var POMODORO_SECS = 25 * 60;
var pomodoroRemaining = POMODORO_SECS;
var pomodoroInterval = null;
var pomodoroRunning = false;
var mainBtn = document.getElementById('mainBtn');
var pomodoroTimerEl = document.getElementById('pomodoroTimer');
var pomodoroLabel = document.getElementById('pomodoroLabel');

// ESP32 pet sync state
var lastPetState = '';

function updatePomodoroDisplay() {
  var m = Math.floor(pomodoroRemaining / 60);
  var s = pomodoroRemaining % 60;
  pomodoroTimerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function beep() {
  try {
    var aCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = aCtx.createOscillator();
    var gain = aCtx.createGain();
    osc.connect(gain);
    gain.connect(aCtx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.5);
    osc.stop(aCtx.currentTime + 0.5);
  } catch(e) {}
}

function syncPetState() {
  var text = badge.textContent;
  var state;
  if (text.indexOf('✓') === 0) {
    state = 'focused';
  } else if (text.indexOf('⚠ 离开') === 0) {
    state = 'away';
  } else if (text.indexOf('⚠') === 0) {
    state = 'distracted';
  } else {
    return;
  }
  if (state === lastPetState) return;
  lastPetState = state;
  var petMap = {focused:'happy', distracted:'worried', away:'sleep'};
  fetch('http://10.10.10.1/pet?state=' + petMap[state], {mode:'no-cors'}).catch(function(){});
  drawPet(petMap[state]);
}

function startPomodoro() {
  pomodoroRemaining = POMODORO_SECS;
  pomodoroRunning = true;
  pomodoroLabel.textContent = '🍅 专注中';
  updatePomodoroDisplay();

  pomodoroInterval = setInterval(function() {
    pomodoroRemaining--;
    var m = Math.floor(pomodoroRemaining / 60);
    var s = pomodoroRemaining % 60;

    if (pomodoroRemaining <= 0) {
      // Timer complete
      pomodoroRemaining = 0;
      updatePomodoroDisplay();
      beep();
      badge.textContent = '✅ 完成！';
      badge.className = 'badge good';
      pomodoroLabel.textContent = '✅ 完成！';
      // 猫猫经验+1 + 成就检测
      addCatXP(1);
      checkAchievements();
      // Auto-reset to 25:00
      pomodoroRemaining = POMODORO_SECS;
      updatePomodoroDisplay();
      pomodoroLabel.textContent = '🍅 专注中';
      return;
    }

    updatePomodoroDisplay();

    // ESP32 timer sync
    fetch('http://10.10.10.1/timer?m=' + m + '&s=' + s, {mode:'no-cors'}).catch(function(){});

    // ESP32 pet sync
    syncPetState();
  }, 1000);
}

function stopPomodoro() {
  if (pomodoroInterval) {
    clearInterval(pomodoroInterval);
    pomodoroInterval = null;
  }
  pomodoroRunning = false;
  pomodoroRemaining = POMODORO_SECS;
  updatePomodoroDisplay();
  pomodoroLabel.textContent = '准备就绪';
  lastPetState = '';
}

// ══════════ 主按钮控制 ══════════

mainBtn.onclick = function() {
  if (pomodoroRunning) {
    // Stop everything
    stop();
    stopPomodoro();
    mainBtn.textContent = '▶ 开始专注';
    mainBtn.className = 'btn-start';
  } else {
    // Start detection + pomodoro
    start();
    startPomodoro();
    mainBtn.textContent = '■ 停止';
    mainBtn.className = 'btn-stop';
  }
};

// ══════════ 📋 今日计划 ══════════

(function() {
  var planInput = document.getElementById('planInput');
  var planBtn = document.getElementById('planGenerateBtn');
  var planList = document.getElementById('planList');
  var planSummary = document.getElementById('planSummary');
  var planDone = document.getElementById('planDone');
  var planTotal = document.getElementById('planTotal');
  var PLAN_KEY = 'focusbuddy_plan_' + new Date().toISOString().slice(0,10);

  // 解析时间字符串 → 分钟数
  function parseDuration(text) {
    var match = text.match(/(\d+)\s*(小时|h|hour|hr)/i);
    if (match) return parseInt(match[1]) * 60;
    match = text.match(/(\d+)\s*(分钟|min|m)(?!s)/i);
    if (match) return parseInt(match[1]);
    return 25; // 默认一个番茄钟
  }

  function parsePlan(text) {
    var lines = text.split('\n').filter(function(l) { return l.trim(); });
    return lines.map(function(line) {
      line = line.trim();
      // 移除行号前缀
      line = line.replace(/^\d+[\.\\)\s]+/, '');
      var minutes = parseDuration(line);
      // 从文本中移除时间描述，只留任务名
      var name = line.replace(/\d+\s*(小时|h|hour|hr|分钟|min|m)\s*/gi, '').trim();
      // 去掉首尾的 '-'、'、'等符号
      name = name.replace(/^[-\\)\.\s、，,，]+/, '').replace(/[-\s、，,，]+$/, '');
      if (!name) name = line.replace(/\d+\s*(小时|h|hour|hr|分钟|min|m)\s*/gi, '').trim();
      return { name: name || '任务', minutes: minutes, done: false };
    });
  }

  function renderTasks(tasks) {
    planList.innerHTML = '';
    var doneCount = 0;
    tasks.forEach(function(task, i) {
      if (task.done) doneCount++;
      var div = document.createElement('div');
      div.className = 'plan-task' + (task.done ? ' done' : '');
      div.innerHTML = '<input type="checkbox"' + (task.done ? ' checked' : '') + '>'
        + '<span class="task-name">' + escapeHtml(task.name) + '</span>'
        + '<span class="task-time">' + task.minutes + 'min</span>';
      div.querySelector('input').addEventListener('change', function(e) {
        task.done = e.target.checked;
        div.classList.toggle('done', task.done);
        saveTasks(tasks);
        updateSummary(tasks);
      });
      planList.appendChild(div);
    });
    updateSummary(tasks);
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateSummary(tasks) {
    var done = tasks.filter(function(t) { return t.done; }).length;
    planDone.textContent = done;
    planTotal.textContent = tasks.length;
    planSummary.classList.remove('hidden');
  }

  function saveTasks(tasks) {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify(tasks)); } catch(e) {}
  }

  function loadTasks() {
    try {
      var raw = localStorage.getItem(PLAN_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }

  planBtn.addEventListener('click', function() {
    var text = planInput.value.trim();
    if (!text) return;
    var tasks = parsePlan(text);
    if (tasks.length === 0) return;
    saveTasks(tasks);
    renderTasks(tasks);
  });

  // 按回车也生成
  planInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
      planBtn.click();
    }
  });

  // 页面加载时恢复今日已有计划
  var saved = loadTasks();
  if (saved && saved.length > 0) {
    planInput.value = saved.map(function(t) { return t.name + ' ' + t.minutes + '分钟'; }).join('\n');
    renderTasks(saved);
  }

// ══════════ 🐱 猫猫养成 + 🏆 成就系统 ══════════

(function() {
  var PET_KEY = 'focusbuddy_pet';
  var skinUnlocked = {};
  var achUnlocked = {};

  // 等级门槛（累积XP）
  var LEVELS = [
    { level: 1, xp: 0,   skin: null },
    { level: 2, xp: 5,   skin: 'hat' },
    { level: 3, xp: 15,  skin: 'scarf' },
    { level: 4, xp: 30,  skin: 'glasses' },
    { level: 5, xp: 50,  skin: 'crown' },
    { level: 6, xp: 80,  skin: null },
  ];

  // 成就列表
  var ACHIEVEMENTS = [
    { id: 'first_pomo', name: '🍅 初出茅庐', desc: '完成第1个番茄钟', icon: '🏆', check: function(d) { return d.totalPomo >= 1; } },
    { id: 'pomo_10',    name: '🍅🍅 番茄农夫', desc: '完成10个番茄钟', icon: '🏆', check: function(d) { return d.totalPomo >= 10; } },
    { id: 'pomo_50',    name: '🍅🍅🍅 番茄大师', desc: '完成50个番茄钟', icon: '🏆', check: function(d) { return d.totalPomo >= 50; } },
    { id: 'level_3',    name: '🐱 猫猫升级', desc: '升到Lv.3', icon: '🌟', check: function(d) { return d.level >= 3; } },
    { id: 'level_5',    name: '👑 猫猫王者', desc: '升到Lv.5', icon: '🌟', check: function(d) { return d.level >= 5; } },
    { id: 'first_skin', name: '🎩 换装初体验', desc: '解锁第一个猫皮肤', icon: '🎨', check: function(d) { return Object.keys(d.skins || {}).length >= 1; } },
    { id: 'all_skins',  name: '🕶️ 时尚达人', desc: '解锁全部猫皮肤', icon: '🎨', check: function(d) { return Object.keys(d.skins || {}).length >= 4; } },
    { id: 'streak_3',   name: '📅 三天打鱼', desc: '连续3天完成番茄钟', icon: '🔥', check: function(d) { return d.streak >= 3; } },
    { id: 'streak_7',   name: '📅📅 一周学霸', desc: '连续7天完成番茄钟', icon: '🔥', check: function(d) { return d.streak >= 7; } },
  ];

  // ===== 加载/保存 =====
  function loadPetData() {
    try {
      var raw = localStorage.getItem(PET_KEY);
      return raw ? JSON.parse(raw) : getDefaultData();
    } catch(e) { return getDefaultData(); }
  }

  function getDefaultData() {
    return {
      xp: 0,
      level: 1,
      totalPomo: 0,
      skins: {},
      achievements: [],
      lastDate: '',
      streak: 0,
      newAch: null
    };
  }

  function savePetData(d) {
    try { localStorage.setItem(PET_KEY, JSON.stringify(d)); } catch(e) {}
  }

  // ===== XP与等级 =====
  function getLevelInfo(xp) {
    for (var i = LEVELS.length - 1; i >= 0; i--) {
      if (xp >= LEVELS[i].xp) return LEVELS[i];
    }
    return LEVELS[0];
  }

  function getNextLevelXp(level) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].level > level) return LEVELS[i].xp;
    }
    return LEVELS[LEVELS.length - 1].xp + 30;
  }

  window.addCatXP = function(amount) {
    var d = loadPetData();
    d.xp += amount;
    d.totalPomo++;

    // 连续天数
    var today = new Date().toISOString().slice(0, 10);
    if (d.lastDate !== today) {
      var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      if (d.lastDate === yesterday) {
        d.streak++;
      } else if (d.lastDate !== today) {
        d.streak = 1;
      }
      d.lastDate = today;
    }

    // 等级更新
    var oldLevel = d.level;
    var info = getLevelInfo(d.xp);
    d.level = info.level;
    if (info.skin && !d.skins[info.skin]) {
      d.skins[info.skin] = true;
      // 升级时标记新成就
      d.newAch = { type: 'level', level: info.level, skin: info.skin };
    }

    savePetData(d);
    updatePetUI(d);
  };

  // ===== 成就检测 =====
  window.checkAchievements = function() {
    var d = loadPetData();
    var newlyUnlocked = [];

    ACHIEVEMENTS.forEach(function(ach) {
      // 跳过已解锁
      for (var i = 0; i < d.achievements.length; i++) {
        if (d.achievements[i] === ach.id) return;
      }
      if (ach.check(d)) {
        d.achievements.push(ach.id);
        newlyUnlocked.push(ach);
      }
    });

    if (newlyUnlocked.length > 0) {
      d.newAch = { type: 'achievement', items: newlyUnlocked };
      savePetData(d);
      updatePetUI(d);
      // 显示弹窗
      showAchievementToast(newlyUnlocked);
    }
  };

  // ===== UI更新 =====
  function updatePetUI(d) {
    var levelEl = document.getElementById('petLevel');
    var xpBar = document.getElementById('petXpBar');
    var xpText = document.getElementById('petXpText');
    var skinEls = document.querySelectorAll('.pet-skin-item');
    var achContainer = document.getElementById('petAchievements');

    if (!levelEl) return;

    // 等级
    levelEl.textContent = 'Lv.' + d.level;

    // XP条
    var currentLevelXp = LEVELS[d.level - 1] ? LEVELS[d.level - 1].xp : 0;
    var nextLevelXp = getNextLevelXp(d.level);
    var xpInLevel = d.xp - currentLevelXp;
    var xpNeeded = nextLevelXp - currentLevelXp;
    var pct = Math.min(100, (xpInLevel / xpNeeded) * 100);
    xpBar.style.width = pct + '%';
    xpText.textContent = d.xp + ' / ' + nextLevelXp + ' XP';

    // 皮肤解锁状态
    var skinIdx = ['hat', 'scarf', 'glasses', 'crown'];
    for (var i = 0; i < skinIdx.length; i++) {
      var el = skinEls[i + 1];
      if (d.skins[skinIdx[i]]) {
        el.classList.add('unlocked');
      } else {
        el.classList.remove('unlocked');
      }
    }

    // 成就列表
    if (achContainer) {
      achContainer.innerHTML = '';
      ACHIEVEMENTS.forEach(function(ach) {
        var unlocked = d.achievements.indexOf(ach.id) >= 0;
        var div = document.createElement('div');
        div.className = 'pet-achievement';
        div.innerHTML = '<span class="ach-icon">' + ach.icon + '</span>'
          + '<span class="ach-name ' + (unlocked ? 'unlocked' : 'locked') + '">' + ach.desc + '</span>';
        achContainer.appendChild(div);
      });
    }

    // 检查升级弹窗
    if (d.newAch) {
      if (d.newAch.type === 'level') {
        showLevelUpToast(d.newAch);
      }
      d.newAch = null;
      savePetData(d);
    }
  }

  // ===== 弹窗 =====
  function showLevelUpToast(info) {
    var emoji = { 'hat':'🎩', 'scarf':'🧣', 'glasses':'🕶️', 'crown':'👑' };
    var names = { 'hat':'礼帽猫', 'scarf':'围巾猫', 'glasses':'墨镜猫', 'crown':'皇冠猫' };
    var toast = document.getElementById('petToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'petToast';
      toast.className = 'pet-toast';
      toast.innerHTML = '<div class="icon" id="toastIcon">⬆️</div>'
        + '<div class="title" id="toastTitle">升级！</div>'
        + '<div class="desc" id="toastDesc"></div>';
      document.body.appendChild(toast);
    }
    var skinEmoji = emoji[info.skin] || '🐱';
    var skinName = names[info.skin] || '';
    document.getElementById('toastIcon').textContent = skinEmoji;
    document.getElementById('toastTitle').textContent = 'Lv.' + info.level + ' 升级！';
    document.getElementById('toastDesc').textContent = '解锁新皮肤: ' + skinName;
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 3000);
  }

  function showAchievementToast(achievements) {
    var toast = document.getElementById('achToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'achToast';
      toast.className = 'pet-toast';
      document.body.appendChild(toast);
    }
    var names = achievements.map(function(a) { return a.name; }).join('\n');
    toast.innerHTML = '<div class="icon">🏆</div>'
      + '<div class="title">成就解锁！</div>'
      + '<div class="desc">' + names.replace(/\n/g, '<br>') + '</div>';
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 3500);
  }

  // ===== 画猫配件 =====
  var originalDrawPet = window.drawPet;
  window.drawPet = function(state) {
    try { if (originalDrawPet) originalDrawPet(state); } catch(e) {}
    if (!petCtx) return;
    try {
      var d = loadPetData();
      var c = petCtx;
      var accentColor = '#ff6b35';
      try { accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff6b35'; } catch(e) {}
      if (d.skins.hat) {
        c.fillStyle = accentColor;
        for (var x = 5; x <= 18; x++) c.fillRect(x * 10, 0, 10, 10);
        for (var x = 7; x <= 16; x++) c.fillRect(x * 10, 10, 10, 10);
      }
      if (d.skins.scarf) {
        c.fillStyle = '#e74c3c';
        for (var x = 6; x <= 17; x++) c.fillRect(x * 10, 170, 10, 10);
        c.fillRect(8 * 10, 180, 10, 10); c.fillRect(15 * 10, 180, 10, 10);
      }
      if (d.skins.glasses) {
        c.fillStyle = '#333';
        for (var x = 6; x <= 11; x++) c.fillRect(x * 10, 80, 10, 10);
        for (var x = 12; x <= 17; x++) c.fillRect(x * 10, 80, 10, 10);
        c.fillRect(4 * 10, 85, 10, 10); c.fillRect(19 * 10, 85, 10, 10);
      }
      if (d.skins.crown) {
        c.fillStyle = '#f1c40f';
        c.fillRect(8 * 10, 0, 10, 10); c.fillRect(11 * 10, 0, 10, 10); c.fillRect(14 * 10, 0, 10, 10);
        for (var x = 7; x <= 15; x++) c.fillRect(x * 10, 10, 10, 10);
      }
    } catch(e) {}
  };
  try { var data = loadPetData(); updatePetUI(data); } catch(e) {}
})();

</script>
