<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusBuddy MVP</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f3;--card:#ffffff;--accent:#ff6b35;--accent2:#f0a500;--text:#2d2d2d;--muted:#999;--good:#27ae60;--warn:#e67e22;--bad:#e74c3c}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#faf8f3 0%,#fff5ee 50%,#fdf2e9 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:24px;color:var(--accent);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.main{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%}
.cam-box{position:relative;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);flex:1;min-width:320px;aspect-ratio:4/3}
.cam-box video,.cam-box canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#dreamPet{position:absolute;bottom:16px;right:16px;width:10rem;height:10rem;z-index:15;border-radius:12px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3))}
.badge{position:absolute;top:12px;left:12px;padding:6px 14px;border-radius:20px;font-weight:600;font-size:13px;z-index:10;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px)}
.badge.good{color:var(--good)}
.badge.warn{color:var(--warn)}
.badge.bad{color:var(--bad)}
.panel{display:flex;flex-direction:column;gap:12px;min-width:240px;flex:0 0 240px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05)}
.card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px}
.stat-row .v{font-weight:600;color:var(--accent)}
.timer{font-size:48px;font-weight:700;text-align:center;color:var(--accent);font-family:'Courier New',monospace;margin-bottom:8px}
.timer-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px}
button{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;width:100%;transition:all .2s;color:#fff}
.btn-start{background:var(--accent)}
.btn-start:hover{opacity:.9}
.btn-stop{background:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.warn-banner{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;z-index:100;display:none;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.03)}}
.btn-sm{padding:8px 12px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;color:#fff;background:var(--accent);white-space:nowrap}
.btn-sm:hover{opacity:.9}
.plan-input-row{display:flex;gap:8px;align-items:flex-start}
.plan-input-row textarea{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:13px;resize:vertical;font-family:inherit;background:#faf8f3}
.plan-input-row textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.plan-list{margin-top:12px}
.plan-task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px}
.plan-task:last-child{border-bottom:none}
.plan-task input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.plan-task .task-name{flex:1}
.plan-task .task-time{color:var(--muted);font-size:11px;white-space:nowrap}
.plan-task.done .task-name{text-decoration:line-through;color:var(--muted)}
.plan-task .del-btn{width:20px;height:20px;padding:0;border:none;border-radius:50%;background:transparent;color:#ccc;font-size:16px;line-height:1;cursor:pointer;flex:none;transition:all .15s}
.plan-task .del-btn:hover{background:#fee;color:var(--bad)}
.plan-summary{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.04)}
.hidden{display:none}

/* 专注分析 */
.focus-pct{font-size:42px;font-weight:700;text-align:center;margin:4px 0}
.focus-pct.high{color:var(--good)}
.focus-pct.mid{color:var(--warn)}
.focus-pct.low{color:var(--bad)}
#focusChart{display:block;margin:0 auto;width:120px;height:120px}
.chart-legend{display:flex;gap:12px;justify-content:center;font-size:11px;margin-top:6px}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* 专注等级 */
.lvl-card{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,0.05);text-align:center}
.lvl-card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.lvl-num{font-size:36px;font-weight:700;color:var(--accent)}
.lvl-xp-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:8px 0 4px}
.lvl-xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s}
.lvl-xp-txt{font-size:11px;color:var(--muted)}

/* 番茄预设 */
.preset-btn{padding:6px 10px;border:2px solid #e0e0e0;border-radius:6px;background:#fff;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;width:auto;flex:none}
.preset-btn:hover{border-color:var(--accent);color:var(--accent)}
.preset-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<h1>🐱 FocusBuddy</h1>
<div class="sub">学习专注伴侣</div>

<div class="main">
  <div class="cam-box">
    <div class="badge good" id="badge">准备就绪</div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <img id="dreamPet" src="dream-emoji/sad.jpg" alt="Dream">
  </div>

  <div class="panel">
    <div class="card">
      <h3>👀 检测状态</h3>
      <div class="stat-row"><span>眼睛状态</span><span class="v" id="valEye">—</span></div>
      <div class="stat-row"><span>头部姿态</span><span class="v" id="valHead">—</span></div>
      <div class="stat-row"><span>东张西望</span><span class="v" id="valTurn">—</span></div>
    </div>

    <div class="card">
      <h3>📊 专注分析</h3>
      <div class="focus-pct high" id="focusPct">100%</div>
      <canvas id="focusChart" width="120" height="120"></canvas>
      <div class="chart-legend">
        <span><span class="chart-dot" style="background:#27ae60"></span>专注</span>
        <span><span class="chart-dot" style="background:#e67e22"></span>走神</span>
      </div>
    </div>

    <div class="card" style="text-align:center">
      <h3>🍅 番茄计时</h3>
      <div class="timer-label" id="pomodoroLabel">准备就绪</div>
      <div style="position:relative;display:inline-block;margin:0 auto">
        <svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#eee" stroke-width="8"/>
          <circle id="pomoRing" cx="70" cy="70" r="60" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="0" style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
          <div class="timer" id="pomodoroTimer" style="font-size:28px;margin:0">25:00</div>
          <span id="pomodoroSetting" style="font-size:11px;color:var(--muted)">25 min</span>
        </div>
      </div>
      <div style="display:flex;gap:4px;justify-content:center;margin:10px 0">
        <button onclick="setPomodoro(15)" class="preset-btn" data-v="15">15m</button>
        <button onclick="setPomodoro(25)" class="preset-btn active" data-v="25">25m</button>
        <button onclick="setPomodoro(45)" class="preset-btn" data-v="45">45m</button>
        <button onclick="setPomodoro(60)" class="preset-btn" data-v="60">60m</button>
      </div>
      <button class="btn-start" id="mainBtn">▶ 开始专注</button>
    </div>

    <div class="card" id="dailyReport" style="text-align:center">
      <h3>📊 今日战报</h3>
      <div style="display:flex;justify-content:space-around;margin:8px 0">
        <div><div style="font-size:28px;font-weight:700;color:var(--accent)" id="streakDays">0</div><div style="font-size:10px;color:var(--muted)">🔥 连续天数</div></div>
        <div><div style="font-size:28px;font-weight:700;color:var(--good)" id="todayPomos">0</div><div style="font-size:10px;color:var(--muted)">🍅 完成番茄</div></div>
        <div><div style="font-size:28px;font-weight:700;color:var(--accent2)" id="todayFocus">0m</div><div style="font-size:10px;color:var(--muted)">⏱ 专注时长</div></div>
      </div>
    </div>

    <div class="lvl-card">
      <h3>📈 专注等级</h3>
      <div class="lvl-num" id="lvlNum">Lv.1</div>
      <div class="lvl-xp-bar"><div class="lvl-xp-fill" id="lvlXpBar" style="width:0%"></div></div>
      <div class="lvl-xp-txt" id="lvlXpTxt">0 / 10 XP</div>
      <div style="text-align:right;margin-top:4px"><a href="#" id="lvlReset" style="font-size:10px;color:var(--muted);text-decoration:none">重置</a></div>
    </div>

    <div class="card" style="order:99; min-width:220px">
      <h3>📋 今日计划 <span style="font-weight:400;font-size:11px;color:var(--muted)">Ctrl+Enter 快速生成</span></h3>
      <textarea id="planInput" rows="5" placeholder="写今天要做的事，每行一条&#10;例如：&#10;写论文 2小时&#10;整理数据 30分钟&#10;做PPT" style="width:100%;border:2px dashed #ddd;border-radius:8px;padding:10px;font-size:13px;resize:vertical;font-family:inherit;background:#fffbeb;min-height:80px"></textarea>
      <button id="planGenerateBtn" class="btn-sm" type="button" onclick="window.genPlan()" style="width:100%;margin-top:8px;padding:10px;font-size:14px">✨ 生成计划</button>
      <div id="planList" class="plan-list"></div>
      <div id="planSummary" class="plan-summary hidden">
        <span id="planDone">0</span>/<span id="planTotal">0</span> 已完成
      </div>
    </div>
  </div>
</div>

<div class="warn-banner" id="warnBanner"></div>

<!-- Hidden elements for compatibility with original detection code -->
<div class="hidden">
  <span id="faceDot"></span>
  <span id="debugInfo"></span>
  <span id="focusScore">100</span>
  <span id="distCount">0</span>
  <span id="timer">00:00</span>
  <span id="timerLabel">—</span>
  <button id="startBtn"></button>
  <button id="stopBtn"></button>
  <audio id="alertAudio" preload="auto"></audio>
</div>

<script>
// ==================== 检测代码（移植自旧项目 v1.7，已验证）====================

var video = document.getElementById('video');
var overlay = document.getElementById('overlay');
var ctx = overlay.getContext('2d');
var badge = document.getElementById('badge');
var warnBanner = document.getElementById('warnBanner');

// ===== Dream 表情宠物（图片版）=====
var dreamPet = document.getElementById('dreamPet');
var dreamFace = 'sad';

function setDreamFace(face) {
  if (face === dreamFace) return;
  dreamFace = face;
  var lv = 1;
  try { var d = JSON.parse(localStorage.getItem('***')); if (d && d.level) lv = d.level; } catch(e) {}
  if (lv >= 3) {
    var map = { happy: 'happy.jpg', angry: 'angry.png', sad: 'sad.png' };
    dreamPet.src = 'george-emoji/' + (map[face] || 'sad.png');
  } else if (lv >= 2) {
    var map = { happy: 'happy.webp', angry: 'angry.png', sad: 'sad.png' };
    dreamPet.src = 'sapnap-emoji/' + (map[face] || 'sad.png');
  } else {
    var map = { happy: 'happy.png', angry: 'angry.png', sad: 'sad.jpg' };
    dreamPet.src = 'dream-emoji/' + (map[face] || 'sad.jpg');
  }
}

// 初始显示默认表情
setDreamFace('sad');
drawFocusChart(100);

var startBtn = document.getElementById('startBtn');
var stopBtn = document.getElementById('stopBtn');
var loadingMsg = document.getElementById('timerLabel');

// 状态
var valEye = document.getElementById('valEye');
var valHead = document.getElementById('valHead');
var valTurn = document.getElementById('valTurn');
var faceDot = document.getElementById('faceDot');
var debugInfo = document.getElementById('debugInfo');
var focusScoreEl = document.getElementById('focusScore');
var distCountEl = document.getElementById('distCount');
var timerEl = document.getElementById('timer');
var timerLabel = document.getElementById('timerLabel');

var faceMesh = null;
var camera = null;
var running = false;

// 检测阈值（来自旧项目，已验证）
var EAR_THRESHOLD = 0.22;
var HEAD_THRESHOLD = 0.38;
var BLINK_IGNORE_MS = 800;
var eyeCloseStart = null;
var TURN_THRESHOLD = 0.62;
var MAR_THRESHOLD = 0.6;
var YAWN_MIN_MS = 1200;
var mouthOpenStart = null;
var yawnCooldown = 0;

// 分心状态
var distractStartTime = null;
var isDistracted = false;
var distractCount = 0;
var focusScore = 100;
var sessionStart = null;

// 语音提醒
var alertAudio = document.getElementById('alertAudio');
var lastVoiceAlert = 0;
var VOICE_COOLDOWN = 15000; // 15秒内不重复播放

function playVoiceAlert(reason) {
  if (!alertAudio || !alertAudio.src) return;
  var now = Date.now();
  if (now - lastVoiceAlert < VOICE_COOLDOWN) return;
  lastVoiceAlert = now;
  try { alertAudio.play().catch(function(){}) } catch(e) {}
}

// 设置语音文件路径（Vickie用这个加载自定义语音）
window.setAlertVoice = function(filePath) {
  if (alertAudio) { alertAudio.src = filePath; alertAudio.load(); }
};

// 加载自定义语音
setAlertVoice('alert_voice.mp3');

// 画面尺寸（修正宽高比失真 — 旧项目坑2）
var frameW = 640, frameH = 480;

// 计时器
var timerInterval = null;
var focusSec = 0, distractSec = 0;

// ══════════ 以下全部来自旧项目，一字不改 ══════════

function dist(a, b) {
  var dx = (a.x - b.x) * frameW;
  var dy = (a.y - b.y) * frameH;
  return Math.hypot(dx, dy);
}

function eyeAspectRatio(landmarks, indices) {
  var p = indices.map(function(i) { return landmarks[i]; });
  var v1 = dist(p[1], p[5]);
  var v2 = dist(p[2], p[4]);
  var h = dist(p[0], p[3]);
  return (v1 + v2) / (2 * h);
}

var LEFT_EYE = [33, 160, 158, 133, 153, 144];
var RIGHT_EYE = [362, 385, 387, 263, 373, 380];

function onResults(results) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  var hasFace = results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0;
  var distracted = false;
  var reason = '';

  if (!hasFace) {
    valEye.textContent = '—';
    valHead.textContent = '—';
    valTurn.textContent = '—';
    faceDot.className = 'dot dot-red';
    debugInfo.textContent = '无人脸';
    distracted = true;
    reason = '离开画面';
  } else {
    var lm = results.multiFaceLandmarks[0];
    faceDot.className = 'dot dot-green';

    // 1. 眼睛检测
    var leftEAR = eyeAspectRatio(lm, LEFT_EYE);
    var rightEAR = eyeAspectRatio(lm, RIGHT_EYE);
    var ear = (leftEAR + rightEAR) / 2;
    var eyesClosedRaw = ear < EAR_THRESHOLD;

    if (eyesClosedRaw) {
      if (eyeCloseStart === null) eyeCloseStart = Date.now();
    } else {
      eyeCloseStart = null;
    }
    var eyesClosed = eyeCloseStart !== null && (Date.now() - eyeCloseStart) >= BLINK_IGNORE_MS;

    if (eyesClosed) {
      valEye.textContent = '闭眼 😴 (' + ear.toFixed(2) + ')';
      distracted = true;
      reason = '闭眼/瞌睡';
    } else if (eyesClosedRaw) {
      valEye.textContent = '眨眼 😐 (' + ear.toFixed(2) + ')';
    } else {
      valEye.textContent = '睁开 👀 (' + ear.toFixed(2) + ')';
    }

    // 2. 低头检测
    var noseTip = lm[1];
    var foreHead = lm[10];
    var chin = lm[152];
    var faceHeight = dist(foreHead, chin);
    var noseToChin = dist(noseTip, chin);
    var headRatio = noseToChin / faceHeight;
    var headDown = headRatio < HEAD_THRESHOLD;

    if (headDown) {
      valHead.textContent = '低头 📉 (' + headRatio.toFixed(2) + ')';
      distracted = true;
      if (!reason) reason = '低头';
    } else {
      valHead.textContent = '正常 (' + headRatio.toFixed(2) + ')';
    }

    // 3. 东张西望
    var leftCheek = lm[234];
    var rightCheek = lm[454];
    var noseToLeft = dist(noseTip, leftCheek);
    var noseToRight = dist(noseTip, rightCheek);
    var turnRatio = Math.min(noseToLeft, noseToRight) / Math.max(noseToLeft, noseToRight);
    var lookingAway = turnRatio < TURN_THRESHOLD;

    if (lookingAway) {
      valTurn.textContent = '转头 👀 (' + turnRatio.toFixed(2) + ')';
      distracted = true;
      if (!reason) reason = '东张西望';
    } else {
      valTurn.textContent = '正常 (' + turnRatio.toFixed(2) + ')';
    }

    // 4. 打哈欠
    var mouthTop = lm[13];
    var mouthBottom = lm[14];
    var mouthLeft = lm[61];
    var mouthRight = lm[291];
    var mar = dist(mouthTop, mouthBottom) / dist(mouthLeft, mouthRight);
    var mouthOpen = mar > MAR_THRESHOLD;

    if (mouthOpen) {
      if (mouthOpenStart === null) mouthOpenStart = Date.now();
    } else {
      mouthOpenStart = null;
    }
    var yawning = mouthOpenStart !== null && (Date.now() - mouthOpenStart) >= YAWN_MIN_MS;

    if (yawning && Date.now() > yawnCooldown) {
      yawnCooldown = Date.now() + 15000;
      showWarn('😪 你好像累了，休息一下吧~');
    }

    // 调试信息
    debugInfo.textContent = 'EAR:' + ear.toFixed(2) + ' Turn:' + turnRatio.toFixed(2) + ' Head:' + headRatio.toFixed(2) + ' MAR:' + mar.toFixed(2);
  }

  handleDistraction(distracted, reason);
  updateStats();
}

function handleDistraction(distracted, reason) {
  var now = Date.now();
  var threshold = 1500; // 1.5秒延迟（从3秒改短）

  if (distracted) {
    if (distractStartTime === null) distractStartTime = now;
    var elapsed = now - distractStartTime;

    if (elapsed >= threshold && !isDistracted) {
      isDistracted = true;
      distractCount++;
      playVoiceAlert(reason);
      showWarn('⚠ ' + reason + '！请集中注意力');
    }

    if (isDistracted) {
      badge.textContent = '⚠ ' + reason;
      badge.className = 'badge bad';
    } else {
      badge.textContent = '检测中...';
      badge.className = 'badge warn';
    }

    focusScore = Math.max(0, focusScore - 0.15);
  } else {
    distractStartTime = null;
    if (isDistracted) {
      isDistracted = false;
      warnBanner.style.display = 'none';
    }
    badge.textContent = '✓ 专注中';
    badge.className = 'badge good';
    focusScore = Math.min(100, focusScore + 0.05);
  }
}

function showWarn(msg) {
  warnBanner.textContent = msg;
  warnBanner.style.display = 'block';
  setTimeout(function() { warnBanner.style.display = 'none'; }, 4000);
}

function updateStats() {
  var pct = Math.round(focusScore);
  focusScoreEl.textContent = pct;
  distCountEl.textContent = distractCount;

  // 专注分析
  var pctEl = document.getElementById('focusPct');
  if (pctEl) {
    pctEl.textContent = pct + '%';
    pctEl.className = 'focus-pct ' + (pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low');
  }
  drawFocusChart(pct);

  if (sessionStart) {
    var secs = Math.floor((Date.now() - sessionStart) / 1000);
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    timerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
}

function drawFocusChart(pct) {
  var canvas = document.getElementById('focusChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var cx = 60, cy = 60, r = 50;
  ctx.clearRect(0, 0, 120, 120);

  // 底色（走神）
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#e67e22';
  ctx.fill();

  // 专注弧度
  var angle = (pct / 100) * Math.PI * 2 - Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, -Math.PI / 2, angle);
  ctx.fillStyle = '#27ae60';
  ctx.fill();

  // 中心白圆（甜甜圈效果）
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // 中间数字
  ctx.fillStyle = '#2d2d2d';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pct + '%', cx, cy);
}

// ══════════ 启动/停止（使用旧项目的 Camera 工具类）══════════

async function start() {
  timerLabel.textContent = '正在加载模型...';
  startBtn.disabled = true;

  if (typeof FaceMesh === 'undefined' || typeof Camera === 'undefined') {
    alert('模型库加载失败，请检查网络后刷新');
    startBtn.disabled = false;
    return;
  }

  faceMesh = new FaceMesh({
    locateFile: function(file) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + file; }
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onResults);

  try {
    camera = new Camera(video, {
      onFrame: async function() { await faceMesh.send({ image: video }); },
      width: 640,
      height: 480
    });
    await camera.start();

    setTimeout(function() {
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;
      frameW = overlay.width;
      frameH = overlay.height;
    }, 500);

    running = true;
    sessionStart = Date.now();
    focusScore = 100;
    distractCount = 0;
    stopBtn.disabled = false;
    timerLabel.textContent = '专注计时中';
  } catch (err) {
    alert('摄像头无法访问：' + err.message);
    startBtn.disabled = false;
  }
}

function stop() {
  if (camera) camera.stop();
  running = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  badge.textContent = '已停止';
  badge.className = 'badge good';
  timerLabel.textContent = '未开始';
  valEye.textContent = '—';
  valHead.textContent = '—';
  valTurn.textContent = '—';
  faceDot.className = 'dot dot-gray';
  debugInfo.textContent = '';
  warnBanner.style.display = 'none';
  ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ══════════ 🍅 番茄计时 ══════════

var POMODORO_SECS = 25 * 60;
var pomodoroRemaining = POMODORO_SECS;
var pomodoroInterval = null;
var pomodoroRunning = false;
var mainBtn = document.getElementById('mainBtn');
var pomodoroTimerEl = document.getElementById('pomodoroTimer');
var pomodoroLabel = document.getElementById('pomodoroLabel');
var pomodoroSettingEl = document.getElementById('pomodoroSetting');
var pomoRing = document.getElementById('pomoRing');
var RING_CIRC = Math.PI * 2 * 60; // ~377

function updatePomoRing() {
  if (!pomoRing) return;
  var pct = pomodoroRemaining / POMODORO_SECS;
  pomoRing.setAttribute('stroke-dashoffset', RING_CIRC * (1 - pct));
  pomoRing.setAttribute('stroke', pct > 0.5 ? 'var(--accent)' : pct > 0.2 ? 'var(--warn)' : 'var(--bad)');
}

// 番茄预设
window.setPomodoro = function(min) {
  if (pomodoroRunning) return;
  POMODORO_SECS = min * 60;
  pomodoroRemaining = POMODORO_SECS;
  pomodoroSettingEl.textContent = min + ' min';
  updatePomodoroDisplay();
  updatePomoRing();
  // 高亮当前预设
  document.querySelectorAll('.preset-btn').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.getAttribute('data-v')) === min);
  });
};

// 调整番茄钟时长（兼容旧的+/-按钮，如果存在的话）
window.adjustPomodoro = function(delta) {
  if (pomodoroRunning) return;
  var newMin = Math.round(POMODORO_SECS / 60) + delta;
  if (newMin < 5) newMin = 5;
  if (newMin > 120) newMin = 120;
  window.setPomodoro(newMin);
};

// ESP32 pet sync state
var lastPetState = '';

function updatePomodoroDisplay() {
  var m = Math.floor(pomodoroRemaining / 60);
  var s = pomodoroRemaining % 60;
  pomodoroTimerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function beep() {
  try {
    var aCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = aCtx.createOscillator();
    var gain = aCtx.createGain();
    osc.connect(gain);
    gain.connect(aCtx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.5);
    osc.stop(aCtx.currentTime + 0.5);
  } catch(e) {}
}

function syncPetState() {
  var text = badge.textContent;
  var state;
  if (text.indexOf('✓') === 0) {
    state = 'focused';
  } else if (text.indexOf('⚠ 离开') === 0) {
    state = 'away';
  } else if (text.indexOf('⚠') === 0) {
    state = 'distracted';
  } else {
    return;
  }
  if (state === lastPetState) return;
  lastPetState = state;
  var petMap = {focused:'happy', distracted:'angry', away:'sleep'};
  fetch('http://10.10.10.1/pet?state=' + petMap[state], {mode:'no-cors'}).catch(function(){});
  var faceMap = {focused:'happy', distracted:'angry', away:'sad'};
  setDreamFace(faceMap[state]);
}

function startPomodoro() {
  pomodoroRemaining = POMODORO_SECS;
  pomodoroRunning = true;
  pomodoroLabel.textContent = '🍅 专注中';
  updatePomodoroDisplay();

  pomodoroInterval = setInterval(function() {
    pomodoroRemaining--;
    updatePomoRing();
    var m = Math.floor(pomodoroRemaining / 60);
    var s = pomodoroRemaining % 60;

    if (pomodoroRemaining <= 0) {
      // Timer complete
      pomodoroRemaining = 0;
      updatePomodoroDisplay();
      updatePomoRing();
      beep();
      badge.textContent = '✅ 完成！';
      badge.className = 'badge good';
      pomodoroLabel.textContent = '✅ 完成！';
      // 记录一个番茄 + 专注时长
      addCompletedPomo();
      // Auto-reset
      pomodoroRemaining = POMODORO_SECS;
      updatePomodoroDisplay();
      updatePomoRing();
      pomodoroLabel.textContent = '🍅 专注中';
      return;
    }

    updatePomodoroDisplay();

    // ESP32 timer sync
    fetch('http://10.10.10.1/timer?m=' + m + '&s=' + s, {mode:'no-cors'}).catch(function(){});

    // ESP32 pet sync
    syncPetState();
  }, 1000);
}

function stopPomodoro() {
  if (pomodoroInterval) {
    clearInterval(pomodoroInterval);
    pomodoroInterval = null;
  }
  pomodoroRunning = false;
  pomodoroRemaining = POMODORO_SECS;
  updatePomodoroDisplay();
  pomodoroLabel.textContent = '准备就绪';
  lastPetState = '';
}

// ══════════ 主按钮控制 ══════════

mainBtn.onclick = function() {
  if (pomodoroRunning) {
    // Stop everything
    stop();
    stopPomodoro();
    mainBtn.textContent = '▶ 开始专注';
    mainBtn.className = 'btn-start';
  } else {
    // Start detection + pomodoro
    start();
    startPomodoro();
    mainBtn.textContent = '■ 停止';
    mainBtn.className = 'btn-stop';
  }
};

// ══════════ 🔥 连续天数 + 今日战报 ═════════=

(function() {
  var KEY = '***';
  var TODAY = new Date().toISOString().slice(0,10);

  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); return d || { lastDate:null, streak:0, todayPomos:0, todayMinutes:0, todayDate:null }; }
    catch(e) { return { lastDate:null, streak:0, todayPomos:0, todayMinutes:0, todayDate:null }; }
  }

  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {} }

  function updateUI(d) {
    var s=document.getElementById('streakDays'), p=document.getElementById('todayPomos'), f=document.getElementById('todayFocus');
    if(s) s.textContent = d.streak || 0;
    if(p) p.textContent = d.todayPomos || 0;
    if(f) { var m = d.todayMinutes||0; f.textContent = m>=60 ? Math.floor(m/60)+'h'+(m%60?m%60+'m':'') : m+'m'; }
  }

  var data = load();
  var yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (data.todayDate !== TODAY) {
    if (data.lastDate===yesterday || data.todayDate===yesterday) { data.streak=(data.streak||0)+1; }
    else if (data.lastDate!==TODAY) { data.streak=1; }
    data.lastDate=TODAY; data.todayDate=TODAY; data.todayPomos=0; data.todayMinutes=0;
    save(data);
  }
  updateUI(data);

  window.addCompletedPomo = function() {
    var d=load(); d.todayPomos=(d.todayPomos||0)+1; d.todayMinutes=(d.todayMinutes||0)+Math.round(POMODORO_SECS/60);
    d.lastDate=TODAY; d.todayDate=TODAY; save(d); updateUI(d);
  };
})();

// ══════════ 📋 今日计划 ══════════

(function() {
  var planInput = document.getElementById('planInput');
  var planBtn = document.getElementById('planGenerateBtn');
  var planList = document.getElementById('planList');
  var planSummary = document.getElementById('planSummary');
  var planDone = document.getElementById('planDone');
  var planTotal = document.getElementById('planTotal');

  // 如果 DOM 没加载完就不执行
  if (!planInput || !planBtn || !planList) {
    console.warn('[FocusBuddy] 今日计划 DOM 元素缺失，跳过初始化');
    return;
  }

  var PLAN_KEY = 'focusbuddy_plan_' + new Date().toISOString().slice(0,10);

  // 解析时间 → 分钟数
  function parseDuration(text) {
    var m = text.match(/(\d+)\s*(小时|h|hour|hrs?)/i);
    if (m) return parseInt(m[1]) * 60;
    m = text.match(/(\d+)\s*(分钟|min|mins?)/i);
    if (m) return parseInt(m[1]);
    return 25;
  }

  function cleanName(line) {
    return line
      .replace(/^\d+[\.\\)、，,\s]+/, '')   // 行号前缀
      .replace(/\d+\s*(?:小时|h|hour|hrs?|分钟|min|mins?)\s*/gi, '')  // 时间描述
      .replace(/\d+\s*[hHmM]\b/g, '')        // 英文缩写
      .replace(/^[-\\)\.\s、，,，]+/, '')      // 首部符号
      .replace(/[-\s、，,，]+$/, '')            // 尾部符号
      .trim();
  }

  function parsePlan(text) {
    return text.split(/\r?\n/)
      .map(function(l) { return l.trim(); })
      .filter(function(l) { return l; })
      .map(function(line) {
        var minutes = parseDuration(line);
        var name = cleanName(line);
        if (!name) name = line.replace(/\d+.*/g, '').trim() || '任务';
        return { name: name, minutes: minutes, done: false };
      });
  }

  function renderTasks(tasks) {
    planList.innerHTML = '';
    tasks.forEach(function(task, idx) {
      var div = document.createElement('div');
      div.className = 'plan-task' + (task.done ? ' done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!task.done;
      cb.onchange = function() {
        task.done = cb.checked;
        div.classList.toggle('done', task.done);
        saveTasks(tasks);
        updateSummary(tasks);
      };
      var nameSpan = document.createElement('span');
      nameSpan.className = 'task-name';
      nameSpan.textContent = task.name;
      var timeSpan = document.createElement('span');
      timeSpan.className = 'task-time';
      timeSpan.textContent = task.minutes + 'min';
      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '×';
      delBtn.title = '删除';
      delBtn.onclick = function() {
        tasks.splice(idx, 1);
        saveTasks(tasks);
        renderTasks(tasks);
      };
      div.appendChild(cb);
      div.appendChild(nameSpan);
      div.appendChild(timeSpan);
      div.appendChild(delBtn);
      planList.appendChild(div);
    });
    updateSummary(tasks);
  }

  function updateSummary(tasks) {
    var done = tasks.filter(function(t) { return t.done; }).length;
    planDone.textContent = done;
    planTotal.textContent = tasks.length;
    if (tasks.length > 0) {
      planSummary.classList.remove('hidden');
    }
  }

  function saveTasks(tasks) {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify(tasks)); } catch(e) {}
  }

  function loadTasks() {
    try {
      var raw = localStorage.getItem(PLAN_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }

  // 暴露到全局，保证 inline onclick 能找到
  window.genPlan = function() {
    var text = planInput.value.trim();
    if (!text) return;
    try {
      var tasks = parsePlan(text);
      if (tasks.length === 0) return;
      saveTasks(tasks);
      renderTasks(tasks);
    } catch(e) {
      alert('生成计划出错: ' + e.message);
    }
  };

  // 备用：如果 inline onclick 没触发（比如 JS 禁用了），这里兜底
  planBtn.onclick = function() { window.genPlan(); };

  // Ctrl+Enter 快捷键
  planInput.onkeydown = function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
      e.preventDefault();
      planBtn.onclick();
    }
  };

  // 恢复今日已有计划
  try {
    var saved = loadTasks();
    if (saved && saved.length > 0) {
      planInput.value = saved.map(function(t) {
        var timeStr = t.minutes >= 60
          ? Math.floor(t.minutes / 60) + '小时' + (t.minutes % 60 ? t.minutes % 60 + '分钟' : '')
          : t.minutes + '分钟';
        return t.name + ' ' + timeStr;
      }).join('\n');
      renderTasks(saved);
    }
  } catch(e) { console.error('[FocusBuddy] 恢复计划失败:', e); }
})();

// ══════════ 📈 专注等级系统 ══════════
(function() {
  var LVL_XP = [0, 10, 30, 60, 100]; // Lv1~5 所需累计XP
  var XP_PER_MIN = 5;
  var KEY = '***';

  var lvlNum = document.getElementById('lvlNum');
  var lvlXpBar = document.getElementById('lvlXpBar');
  var lvlXpTxt = document.getElementById('lvlXpTxt');

  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); return d || { xp:0, level:1, secs:0 }; }
    catch(e) { return { xp:0, level:1, secs:0 }; }
  }

  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
  }

  function getLevel(xp) {
    for (var i = LVL_XP.length - 1; i >= 0; i--) { if (xp >= LVL_XP[i]) return i + 1; }
    return 1;
  }

  function updateUI(d) {
    if (!lvlNum) return;
    var lv = getLevel(d.xp);
    if (lv > d.level) d.level = lv;
    lvlNum.textContent = 'Lv.' + d.level;
    var cur = LVL_XP[d.level - 1] || 0;
    var next = LVL_XP[d.level] || (LVL_XP[d.level - 1] + 10);
    var pct = Math.min(100, ((d.xp - cur) / (next - cur)) * 100);
    lvlXpBar.style.width = pct + '%';
    lvlXpTxt.textContent = d.xp + ' / ' + next + ' XP';
  }

  // 每秒检测专注状态
  setInterval(function() {
    try {
      if (typeof running !== 'undefined' && running && typeof isDistracted !== 'undefined' && !isDistracted) {
        var d = load();
        d.secs++;
        if (d.secs >= 60) { d.secs -= 60; d.xp += XP_PER_MIN; }
        d.level = getLevel(d.xp);
        save(d);
        updateUI(d);
      }
    } catch(e) {}
  }, 1000);

  // 初始化显示
  updateUI(load());

  // 重置按钮
  var resetBtn = document.getElementById('lvlReset');
  if (resetBtn) {
    resetBtn.onclick = function(e) {
      e.preventDefault();
      if (confirm('确定重置专注等级吗？所有经验会清零。')) {
        var d = { xp:0, level:1, secs:0 };
        save(d);
        updateUI(d);
      }
    };
  }
})();

</script>
